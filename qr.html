<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>コンディション名刺 QR</title>
<link rel="apple-touch-icon" href="qr-icon.png">
<style>
  html, body{
    margin:0; padding:0;
    background:#14121c;
    height:100%;
    overflow:hidden;
  }
  .frame{
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
</style>
</head>
<body>
<div class="frame">
  <img src="qr.png" alt="コンディション名刺のQRコード">
</div>
</body>
</html>
