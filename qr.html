<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>コンディション名刺 QR</title>
<link rel="apple-touch-icon" href="qr-icon.png">
<style>
  html, body{
    margin:0; padding:0;
    background:#14121c;
    height:100%;
    overflow:hidden;
  }
  .frame{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .share-btn{
    position:fixed;
    left:50%;
    bottom:calc(env(safe-area-inset-bottom,0) + 28px);
    transform:translateX(-50%);
    font-family:-apple-system, "Hiragino Kaku Gothic Pro", sans-serif;
    font-size:0.9rem;
    color:#f6efe3;
    background:rgba(30,27,40,0.85);
    border:1px solid rgba(243,205,133,0.3);
    border-radius:999px;
    padding:.7rem 1.4rem;
    cursor:pointer;
  }
  .share-btn:active{ transform:translateX(-50%) scale(0.96); }
</style>
</head>
<body>
<div class="frame">
  <img src="qr.png" alt="コンディション名刺のQRコード">
  <button class="share-btn" id="share-btn">リンクを送る</button>
</div>
<script>
  const APP_URL = "https://begracenao-alt.github.io/condition-meishi/";
  document.getElementById('share-btn').addEventListener('click', async function(){
    const btn = this;
    if(navigator.share){
      try{
        await navigator.share({ title: 'コンディション名刺', url: APP_URL });
      }catch(e){ /* 共有をやめても、体験は止めない */ }
    } else {
      try{
        await navigator.clipboard.writeText(APP_URL);
        btn.textContent = 'コピーしました';
        setTimeout(function(){ btn.textContent = 'リンクを送る'; }, 2000);
      }catch(e){
        btn.textContent = APP_URL;
      }
    }
  });
</script>
</body>
</html>
